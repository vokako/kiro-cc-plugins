[package]
name = "kiro-cc-plugins-app"
version = "0.3.6"
description = "Kiro CC Plugins Manager"
authors = ["you"]
edition = "2021"
default-run = "KiroCCPlugins"

[lib]
name = "kiro_cc_plugins_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "KiroCCPlugins"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kiro_cc_core = { path = "../../crates/core" }
