[project]
name = "kiro-cc-plugins"
version = "0.2.1"
description = "Install Claude Code plugins into Kiro"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
kiro-cc-plugins = "kiro_cc_plugin_converter.cli:cli"
kiro-cc-plugins-api = "kiro_cc_plugin_converter.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiro_cc_plugin_converter"]
